name: Generate Contribution Snake

on:
  # Jalankan otomatis setiap 12 jam sekali
  schedule:
    - cron: "0 */12 * * *"

  # Memungkinkan dijalankan manual dari tab Actions -> Run workflow
  workflow_dispatch:

  # Jalankan setiap ada push ke branch main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Generate animasi snake SVG (tema cyber-dark cyan agar cocok dengan README)
      - name: Generate GitHub contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=31D7FF
            dist/snake-light.svg?palette=github-light&color_snake=0891B2

      # 2. Push hasil SVG ke branch "output" agar tidak mengotori branch main
      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
